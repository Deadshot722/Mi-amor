<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Una pregunta para ti ❤️</title>

    <link rel="stylesheet" href="estilo.css">

</head>

<body class="pagina-propuesta">

    <div class="container-propuesta">

        <div id="gifContainer">

            <img
                id="gifContainerImg"
                src="imagenes/hello1.jpg"
                alt="Hello Kitty"
            >

        </div>

        <h1 id="question">
            ¿Quieres ser mi novia? ❤️
        </h1>

        <div class="botones">

            <button
                id="siBtn"
                onclick="window.location.href='dijosi.html'">
                Sí ❤️
            </button>

            <button
                id="noBtn">
                No
            </button>

        </div>

    </div>


    <script>

        const gifContainer =
            document.getElementById("gifContainer");

        const gif =
            document.getElementById("gifContainerImg");

        const question =
            document.getElementById("question");

        const siBtn =
            document.getElementById("siBtn");

        const noBtn =
            document.getElementById("noBtn");


        let contador = 0;


        const imagenes = [

            "imagenes/hello1.jpg",
            "imagenes/hello2.jpg",
            "imagenes/hello3.jpg",
            "imagenes/hello4.jpg",
            "imagenes/hello5.jpg",
            "imagenes/hello6.jpg"

        ];


        const mensajes = [

            "¿Segura? 🥺",

            "¿De verdad no quieres? 💔",

            "Piénsalo otra vez 🥺",

            "¿Ni siquiera lo vas a intentar? 😭",

            "Por favor, mi niña ❤️",

            "Ya sabes que quiero estar contigo ❤️"

        ];


        noBtn.addEventListener("click", function () {

            contador++;


            if (contador < imagenes.length) {

                gif.src = imagenes[contador];

            } else {

                gif.src =
                    imagenes[imagenes.length - 1];

            }


            if (contador <= mensajes.length) {

                question.textContent =
                    mensajes[contador - 1];

            }


            const crecimiento =
                Math.min(contador, 6);


            siBtn.style.fontSize =
                (18 + crecimiento * 5) + "px";


            siBtn.style.padding =
                (12 + crecimiento * 4) +
                "px " +
                (25 + crecimiento * 6) +
                "px";


            if (contador >= 6) {

                noBtn.textContent =
                    "No tienes escapatoria 😭";

            }

        });

    </script>

</body>

</html>
