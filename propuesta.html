<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Una pregunta para ti ❤️</title>

    <link rel="stylesheet" href="estilo.css">

</head>

<body class="pagina-propuesta">

    <div class="container-propuesta">

        <!-- IMAGEN DE LA PREGUNTA -->
        <div id="gifContainer">

            <img
                id="gifContainerImg"
                src="imágenes/hello1.jpg"
                alt="Hello Kitty"
            >

        </div>


        <!-- PREGUNTA -->
        <h1>
            ¿Quieres ser mi novia? ❤️
        </h1>


        <!-- BOTONES -->
        <div class="botones">

            <button
                id="siBtn"
                onclick="window.location.href='dijosi.html'">
                Sí ❤️
            </button>

            <button
                id="noBtn">
                No
            </button>

        </div>

    </div>


    <script>

        const noBtn = document.getElementById("noBtn");
        const gif = document.getElementById("gifContainerImg");

        let contador = 0;

        const imagenes = [
            "imágenes/hello1.jpg",
            "imágenes/hello2.jpg",
            "imágenes/hello3.jpg",
            "imágenes/hello4.jpg",
            "imágenes/hello5.jpg",
            "imágenes/hello6.jpg"
        ];

        noBtn.addEventListener("click", function () {

            contador++;

            if (contador < imagenes.length) {

                gif.src = imagenes[contador];

            } else {

                gif.src = imagenes[imagenes.length - 1];

            }

        });

    </script>

</body>

</html>
